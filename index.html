<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>coldharbor.work — MDR Grid</title>
  <meta name="description" content="A Severance-inspired MDR grid for coldharbor.work" />
  <style>
    :root {
      --teal: #27f7ff;
      --bg: #ffffff;
      --fg: #0b0b0b;
      --gap: 6px;
      --grid-cols: 32;
      --cell-size: 26px;
      --glow: 0 0 6px rgba(39,247,255,0.7), 0 0 12px rgba(39,247,255,0.5);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --fg: #d6ffff;
        --teal: #27f7ff;
      }
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, monospace;
      overflow-x: hidden;
    }

    /* CRT EFFECT */
    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      top:0; left:0; width:100%; height:100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02) 0px,
        rgba(255,255,255,0.02) 1px,
        transparent 2px,
        transparent 3px
      );
      opacity: .12;
      mix-blend-mode: screen;
      z-index: 9999;
    }

    header, footer {
      border: 1px solid var(--teal);
      padding: 10px 16px;
      margin: 12px auto;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      text-shadow: var(--glow);
      color: var(--teal);
    }

    .lumon-logo {
      font-weight: bold;
      letter-spacing: 2px;
      font-size: 16px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid-wrap {
      display: grid;
      grid-template-columns: repeat(var(--grid-cols), var(--cell-size));
      gap: var(--gap);
      place-content: center;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .number {
      font-size: 14px;
      color: var(--teal);
      transition: transform 0.14s ease, opacity 0.2s ease;
      text-shadow: var(--glow);
      opacity: 0.9;
    }

    /* MAIN HOVER */
    .cell:hover .number {
      transform: scale(2.2);
      opacity: 1;
    }

    /* ADJACENT MAGNIFICATION */
    .cell.adjacent .number {
      transform: scale(1.5);
      opacity: 0.95;
    }

    /* BAD NUMBER CLUSTER */
    .bad-number {
      position: absolute;
      font-size: 22px;
      color: var(--teal);
      pointer-events: none;
      animation: drift 6s infinite ease-in-out alternate;
      text-shadow: var(--glow);
    }

    @keyframes drift {
      0% { transform: translate(-10px, -10px) scale(1); }
      100% { transform: translate(20px, 25px) scale(1.6); }
    }
  </style>
</head>
<body>
  <header>
    <div class="lumon-logo">Siena</div>
    <div class="lumon-logo">0% Complete</div>
  </header>

  <main class="container">

    <!-- Controls -->
    <div style="margin-bottom:16px;">
      <button id="lumonBadToggle">Bad Mode</button>
      <button id="lumonTextToggle">Text Override</button>
      <input id="textOverride" type="text" placeholder="Message (optional)" style="width:200px;">
    </div>

    <!-- Number Grid -->
    <div id="grid" class="grid-wrap"></div>

    <!-- BAD NUMBER CLUSTER -->
    <div id="bad-cluster"></div>
  </main>

  <footer>
    <div class="lumon-logo">01</div>
    <div class="lumon-logo">02</div>
    <div class="lumon-logo">03</div>
    <div class="lumon-logo">04</div>
    <div class="lumon-logo">05</div>
  </footer>

  <script>
    // grid dimensions
    const gridCols = 32;
    const gridRows = 12; // Adjust as needed (32*12 = 384 cells)

    // Elements
    const lumonBadToggle = document.getElementById('lumonBadToggle');
    const lumonTextToggle = document.getElementById('lumonTextToggle');
    const overrideInput = document.getElementById('textOverride');
    const grid = document.getElementById('grid');

    // Generate initial grid
    function populateGrid(contents) {
      grid.innerHTML = '';
      for (let i = 0; i < gridCols * gridRows; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        const numberSpan = document.createElement('span');
        numberSpan.className = 'number';
        numberSpan.textContent = contents ? contents[i % contents.length] : Math.floor(Math.random() * 10);
        cell.appendChild(numberSpan);
        grid.appendChild(cell);
      }
    }

    // Initial population
    populateGrid();

    // Fade helper
    function fadeSwap(fn){
      grid.classList.add('fade');
      setTimeout(()=>{
        fn();
        grid.classList.remove('fade');
      },250);
    }

    // BAD MODE
    lumonBadToggle.addEventListener('click',()=>{
      lumonBadToggle.classList.toggle('active');
      document.body.classList.toggle('bad-active', lumonBadToggle.classList.contains('active'));
      const params = new URLSearchParams(window.location.search);
      params.set('bad', lumonBadToggle.classList.contains('active')?'1':'0');
      history.replaceState(null,'',`?${params.toString()}`);
    });

    // TEXT OVERRIDE
    lumonTextToggle.addEventListener('click',()=>{
      const active = lumonTextToggle.classList.toggle('active');
      fadeSwap(()=>{
        if(!active){
          grid.classList.remove('override');
          populateGrid();
        } else {
          const content = overrideInput.value.trim();
          const chars = content ? content.split('') : [' '];
          grid.classList.add('override');
          populateGrid(chars);
        }
      });
      const params = new URLSearchParams(window.location.search);
      params.set('text', active?'1':'0');
      params.set('msg', overrideInput.value.trim());
      history.replaceState(null,'',`?${params.toString()}`);
    });

    // URL parameter loading
    const initParams = new URLSearchParams(window.location.search);
    if(initParams.get('bad')==='1'){
      lumonBadToggle.classList.add('active');
      document.body.classList.add('bad-active');
    }
    if(initParams.get('text')==='1'){
      lumonTextToggle.classList.add('active');
      const msg = initParams.get('msg')||'';
      overrideInput.value = msg;
      const chars = msg? msg.split('') : [' '];
      grid.classList.add('override');
      populateGrid(chars);
    }

  </script>
</body>
</html>
