<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>coldharbor.work — MDR Grid</title>
  <meta name="description" content="A Severance-inspired MDR grid for coldharbor.work" />
  <style>
    :root {
      --teal: #00e5db;
      --bg: #ffffff;
      --fg: #0b0b0b;
      --gap: 10px;
      --grid-cols: 20;
      --cell-size: 32px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --fg: #d6ffff;
        --teal: #27f7ff;
      }
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, monospace;
    }

    header, footer {
      border: 1px solid var(--teal);
      padding: 12px 18px;
      margin: 12px auto;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .lumon {
      font-weight: bold;
      letter-spacing: 1px;
      color: var(--teal);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    .grid-wrap {
      display: grid;
      grid-template-columns: repeat(var(--grid-cols), var(--cell-size));
      gap: var(--gap);
      place-content: center;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease;
    }

    .number {
      font-size: 18px;
      color: var(--teal);
      transition: transform 0.12s ease;
    }

    /* Main hover */
    .cell:hover .number {
      transform: scale(1.8);
    }

    /* Adjacent magnification */
    .cell.adjacent .number {
      transform: scale(1.3);
    }

    footer div {
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="lumon">Siena</div>
    <div class="lumon">0% Complete</div>
  </header>

  <main class="container">
    <div id="grid" class="grid-wrap"></div>
  </main>

  <footer>
    <div class="lumon">01</div>
    <div class="lumon">02</div>
    <div class="lumon">03</div>
    <div class="lumon">04</div>
    <div class="lumon">05</div>
  </footer>

  <script>
    const COLS = 20;
    const ROWS = 12;
    const grid = document.getElementById('grid');

    function genDigit() {
      return Math.floor(Math.random() * 10);
    }

    let cells = [];

    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const index = r * COLS + c;
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = index;

        const num = document.createElement('span');
        num.className = 'number';
        num.textContent = genDigit();

        cell.appendChild(num);
        grid.appendChild(cell);
        cells.push(cell);
      }
    }

    function clearAdjacency() {
      cells.forEach(c => c.classList.remove('adjacent'));
    }

    function markAdjacent(centerIndex) {
      const r = Math.floor(centerIndex / COLS);
      const c = centerIndex % COLS;

      const adjacentPositions = [
        [r, c - 1], [r, c + 1],
        [r - 1, c], [r + 1, c]
      ];

      adjacentPositions.forEach(([rr, cc]) => {
        if (rr >= 0 && rr < ROWS && cc >= 0 && cc < COLS) {
          const idx = rr * COLS + cc;
          cells[idx].classList.add('adjacent');
        }
      });
    }

    cells.forEach(cell => {
      cell.addEventListener('mouseenter', () => {
        const i = parseInt(cell.dataset.index);
        clearAdjacency();
        markAdjacent(i);
      });
    });

    grid.addEventListener('mouseleave', clearAdjacency);
  </script>
</body>
</html>
